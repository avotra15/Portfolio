<section id="home">
  <div class="home">
      <div class="home_card">
          <a href="https://github.com/avotra15"><img [src]="'/assets/icones/github.png'" alt="github"></a>
          <a href="https://linkedin.com/in/stanislas-avotra/"><img [src]="'/assets/icones/linkedin.png'" alt="linkedin"></a>
          <img [src]="'/assets/images/profil.png'" alt="profil">
      </div>

      <div class="home_aboutme">
          <div class="home_aboutme-nom"><h3 class="stan">{{texteNom()}}</h3> {{texteSuite()}}</div>

          <div class="home_aboutme-text">{{texteDesc()}}</div>
      </div>

      <div class="btn">
          <button class="view" (click)="openPdf()" ><img [src]="'/assets/icones/doc.png'" alt="doc">Télécharger CV</button>
          <button class="contact" routerLink="/" fragment="contact">Contacter Moi</button>
      </div>

      <div class="prb1">« Avec un grand pouvoir vient… un conflit de merge. » 💻</div>
      <div class="prb2">- Mr. Stanislas</div>
  </div>
</section>

<section id="work">
  <app-work></app-work>
</section>

<section id="skills">
  <app-skills></app-skills>
</section>

<section id="aboutme">
  <app-aboutme></app-aboutme>
</section>

<section id="contact">
  <app-contact></app-contact>
</section>
