<div class="projets">
    @for (projet of projets; track projet.titre) {
    <div class="projet1">
        <div class="projet1-titre">{{ projet.titre }}</div>

        <div class="projet1-img">
            <img [src]="projet.image" alt="portfolio">
        </div>
        <div class="projet1-desc">
            {{ projet.description }}
        </div>
        

        <div class="projet1-techno">
            @for (t of projet.technos; track t.alt) {
            <img [src]="t.icone" [alt]="t.alt">
             }
        </div>
        <button class="projet1-btn" (click)="selectionnerProjet(projet)">Voir plus</button>
    </div>
    }
    <!-- Modal unique plein page -->
     @if (projetSelectionne) {
        <div class="modal">
            <div class="modal-contenu">
                <button class="modal-fermer" (click)="fermerModal()" aria-label="Fermer">&times;</button>

                <h2 class="modal-titre">{{ projetSelectionne.titre }}</h2>

                <img class="modal-img" [src]="projetSelectionne.image" [alt]="projetSelectionne.titre">

                <p class="modal-desc">{{ projetSelectionne.description }}</p>

                <div class="modal-techno">
                    @for (t of projetSelectionne.technos; track t.alt) {
                    <img [src]="t.icone" [alt]="t.alt"> 
                    }
            </div>
        </div>
    </div>
    }
</div>
