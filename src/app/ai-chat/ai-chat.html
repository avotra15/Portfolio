<div class="chat-widget">
  <!-- Bouton flottant pour ouvrir/fermer le chat -->
  <button class="chat-toggle-btn" (click)="toggleChat()">
    <span><img src="/assets/icones/gemini.png" alt="gemini"></span>
  </button>

  <!-- Fenêtre du chat -->
  @if (isOpen) {
    <div class="chat-window">
      <div class="chat-header">
        <span>Assistant IA</span>
        <button class="close-btn" (click)="toggleChat()">✖</button>
      </div>

      <div class="chat-messages">
        @for (message of messages; track message) {
          <div class="message" [ngClass]="message.sender === 'user' ? 'message-user' : 'message-ai'">
            {{ message.text }}
          </div>
        }
      </div>

      <div class="chat-input">
        <input
          type="text"
          [(ngModel)]="userInput"
          placeholder="Écrivez votre message..."
          (keyup.enter)="sendMessage(userInput); userInput = ''"
        />
        <button (click)="sendMessage(userInput); userInput = ''">Envoyer</button>
      </div>
    </div>
  }
</div>
