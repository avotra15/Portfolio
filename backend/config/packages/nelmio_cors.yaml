nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: ['https://avotra-stanislas.netlify.app']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/chat':
            allow_origin: ['https://avotra-stanislas.netlify.app']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['POST', 'OPTIONS']
            max_age: 3600